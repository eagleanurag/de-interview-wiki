name: Run Python Workers

# This workflow validates the repository and publishes the site.
# It does not call the model.
#
# That is a change, and it was made because of what an experiment with
# this file showed. Run 37026765769 fanned enrichment out as twenty
# batches over 490 posts; fourteen succeeded and six failed, every
# failure being a provider response that stopped partway through.
# Aggregation was skipped because a batch had failed, so nothing
# deployed. Each post had exactly one attempt there, so a truncated
# answer was a lost post rather than a re-ask.
#
# Enrichment is now a local concern: `python -m src.pipeline` runs it
# against OpenCode on one machine, retries per post, and writes its
# results to data/results/, which is committed. Everything below is
# deterministic and needs no credential, no network and no model.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The suite takes about ten minutes and the wiki job builds several
# thousand pages, so a generous but real bound: a hung run should be
# reported rather than occupying a runner for hours.
jobs:
  verify:
    name: Tests and security
    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify no credential or session is tracked
        run: |
          set -euo pipefail

          tracked=$(git ls-files)

          # The match is captured rather than tested in a pipeline
          # because `grep -q` exits as soon as it finds one, closing the
          # pipe on printf. Under `set -o pipefail` that SIGPIPE made a
          # real match report printf's status rather than grep's, so a
          # tracked credential read as no match and the guard passed on
          # exactly the input it exists to catch.
          #
          # Whether it misfires depends on how far printf got before
          # grep exited, so it behaves correctly on a handful of tracked
          # paths and wrongly on a repository's worth. Measured against a
          # 1,500-path listing, close to this repository's, a tracked
          # .env was reported clean.
          #
          # Patterns are anchored where a loose match would be wrong.
          # `.env.example` is tracked deliberately and must stay so: it
          # is how somebody learns which variables exist without ever
          # holding a value. Matching `.env` as a substring flagged it
          # -- and because the SIGPIPE bug above was swallowing the
          # result, that over-broad pattern had never actually been
          # exercised until the bug was fixed.
          #
          # `\.env$` rather than `(^|/)\.env$` because plain grep
          # matches basic regular expressions, where a group is written
          # `\(` and the anchored form silently matched nothing at all.
          # Ending the path is the whole requirement, and it needs no
          # group. -E is passed anyway so that a future pattern can use
          # one without changing the dialect under it.
          for pattern in '\.env$' 'chrome_session' \
                          'linkedin_saved_archive' 'data/incoming/'; do
            match=$(printf '%s\n' "$tracked" | grep -E -- "$pattern" || true)

            if [ -n "$match" ]; then
              echo "::error::a tracked path matches $pattern"
              printf '%s\n' "$match" | head -20
              exit 1
            fi
          done

          echo "no credential, session, drop zone or archive is tracked"

      - name: Run the test suite
        run: |
          set -euo pipefail
          python -m pytest -q

      - name: Confirm the working tree is unchanged by the tests
        run: |
          set -euo pipefail

          # The suite writes only into temporary directories, so a
          # difference here means something wrote into the repository.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the test suite modified the repository"
            git status --porcelain | head -30
            exit 1
          fi

          echo "the test suite left the repository untouched"

  aggregate:
    name: Aggregate knowledge base
    needs: verify
    runs-on: ubuntu-latest

    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Count the committed results
        id: expected
        run: |
          set -euo pipefail

          results=$(ls data/results/cloud_worker_*.json 2>/dev/null | wc -l)
          posts=$(ls -d data/posts/*/post.json 2>/dev/null | wc -l)

          echo "worker results: $results"
          echo "posts          : $posts"

          if [ "$results" -eq 0 ]; then
            echo "::error::no worker results are committed"
            exit 1
          fi

          echo "expected=$results" >> "$GITHUB_OUTPUT"

      - name: Aggregate the committed results
        env:
          EXPECTED: ${{ steps.expected.outputs.expected }}

        run: |
          set -euo pipefail

          mkdir -p aggregation

          python -m src.aggregation.aggregator \
            --input-dir data/results \
            --output aggregation/knowledge_base.json \
            --expected-post-count "$EXPECTED"

      - name: Verify the canonical knowledge base
        env:
          EXPECTED: ${{ steps.expected.outputs.expected }}

        run: |
          set -euo pipefail

          test -s aggregation/knowledge_base.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("aggregation/knowledge_base.json").read_text(
                  encoding="utf-8"
              )
          )

          expected = int(os.environ["EXPECTED"])
          stats = payload["stats"]
          aggregated = stats["posts_aggregated"]

          print(f"Expected posts : {expected}")
          print(f"Aggregated     : {aggregated}")
          print(f"Skipped files  : {stats['files_skipped']}")
          print(f"Topics         : {stats['topics_consolidated']}")
          print(f"Concepts       : {stats['concepts_consolidated']}")
          print(f"Technologies   : {stats['technologies_consolidated']}")
          print(f"Questions      : {stats['questions_consolidated']}")

          if aggregated != expected:
              raise SystemExit(
                  "The knowledge base covers "
                  f"{aggregated} post(s), not {expected}. Enrichment "
                  "is incomplete; run it locally and commit the "
                  "results."
              )

          # Skipped files are reported rather than ignored, because a
          # result that silently drops out of the knowledge base is a
          # post that quietly stops being published.
          if stats["files_skipped"]:
              raise SystemExit(
                  f"{stats['files_skipped']} file(s) were skipped; "
                  "every committed result should be a post."
              )
          PY

      - name: Upload the canonical knowledge base
        uses: actions/upload-artifact@v4

        with:
          name: knowledge-base-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: aggregation/knowledge_base.json

  wiki:
    name: Generate static wiki
    needs: aggregate
    runs-on: ubuntu-latest

    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download the knowledge base
        uses: actions/download-artifact@v4

        with:
          name: knowledge-base-${{ github.run_id }}
          path: aggregation

      - name: Generate the site
        run: |
          set -euo pipefail

          python -m src.wiki.generator \
            --input aggregation/knowledge_base.json \
            --output site

      - name: Verify the generated site
        run: |
            set -euo pipefail

            # The pages a reader navigates by. There is no topics.html:
            # that was the archive's index of corpus groupings, and the
            # tree a reader walks is the revision units, which live under
            # revision/ beside the pages they list. This check was stale
            # for two commits and only went unnoticed because the test
            # step above it failed first, so the whole job stopped before
            # reaching it.
            test -s site/index.html
            test -s site/questions.html
            test -s site/search.html
            test -s site/404.html
            test -s site/revision/index.html
            test -s site/assets/search-index.json

            # And no directory that used to hold a page per source
            # record. One page per captured post is 490 pages, and that is
            # the shape of the corpus rather than of the product.
            for retired in posts topics concepts technologies; do
              if [ -e "site/$retired" ]; then
                echo "::error::site/$retired exists; the archive layer is back"
                exit 1
              fi
            done

            pages=$(find site -name '*.html' | wc -l)

            echo "pages generated: $pages"

            # A band rather than a floor. The old check was "-lt 2",
            # which passed for 649 pages and for 9,595. The measured
            # output is 64: four root pages, the revision tree, and 59
            # pages of 22 revision units. Below 20 the generator has
            # stopped producing units; above 100 the granularity has
            # drifted back towards one page per post or per subtopic,
            # which is what this architecture exists to prevent.
            if [ "$pages" -lt 20 ] || [ "$pages" -gt 100 ]; then
              echo "::error::$pages pages is outside 20-100; the revision unit is not holding"
              find site -name '*.html' | head -20
              exit 1
            fi

            # The one thing that must never reach a published page: the
            # path material was imported from.
            if grep -rlE 'C:\\Users|/Users/|AppData|chrome_session|linkedin_saved_archive' \
                 site --include='*.html' --include='*.json' | head -5 | grep -q .; then
              echo "::error::a local path reached the generated site"
              grep -rlE 'C:\\Users|/Users/|AppData|chrome_session' \
                site --include='*.html' | head -5
              exit 1
            fi

            echo "no local path in the generated site"

            # And no machine identifier a reader can see. The posts keep
            # their identifiers in the knowledge base; nothing published
            # may show one, because a reader has no use for it and no way
            # to interpret it.
            if grep -rlE 'urn-li-|urn:li:|data-capture-method' \
                 site --include='*.html' | head -5 | grep -q .; then
              echo "::error::a post or saved-item identifier is visible on a page"
              grep -rlE 'urn-li-|urn:li:|data-capture-method' \
                site --include='*.html' | head -5
              exit 1
            fi

            echo "no identifier is visible on any page"

            # Every internal reference resolves. A relative link that
            # points at nothing is the failure mode a relative-link
            # design introduces, and it is not visible from the
            # filesystem alone -- only from a page's own point of view.
            python - <<'PY'
            import re
            from pathlib import Path

            site = Path("site")

            external = ("http://", "https://", "mailto:", "//", "data:")

            broken = []
            references = 0

            for page in sorted(site.rglob("*.html")):
                text = page.read_text(encoding="utf-8")

                for ref in re.findall(r'(?:href|src)="([^"]+)"', text):
                    if ref.startswith(external):
                        continue

                    target = ref.split("#")[0].split("?")[0]

                    if not target:
                        continue

                    references += 1

                    if not (page.parent / target).resolve().is_file():
                        broken.append(
                            f"{page.relative_to(site)} -> {ref}"
                        )

            print(f"internal references: {references}")

            if broken:
                for line in broken[:10]:
                    print(f"  {line}")

                raise SystemExit(f"{len(broken)} broken internal link(s)")

            print("every internal reference resolves")
            PY

            # Every search record leads to a file. An index entry that
            # points at a page nobody generated is a dead result in the
            # result list, which is worse than a missing entry because it
            # looks like an answer.
            python - <<'PY'
            import json
            from pathlib import Path

            site = Path("site")

            index = json.loads(
                (site / "assets" / "search-index.json").read_text(
                    encoding="utf-8"
                )
            )

            records = index["records"]

            if not records:
                raise SystemExit("the search index is empty")

            dead = [
                record["u"]
                for record in records
                if not (site / record["u"]).is_file()
            ]

            if dead:
                print(f"  {dead[0]} and {len(dead) - 1} more")
                raise SystemExit(
                    f"{len(dead)} indexed page(s) were not generated"
                )

            print(
                f"search index: {len(records)} records, "
                f"{index['units']} units, {index['questions']} questions, "
                "all resolving"
            )
            PY

      - name: Verify the site is reproducible
        run: |
          set -euo pipefail

          # Byte identical on a second build, so a diff in the
          # repository means something changed rather than that the
          # clock moved.
          cp -r site site-first

          rm -rf site

          python -m src.wiki.generator \
            --input aggregation/knowledge_base.json \
            --output site

          if ! diff -r site-first site > /dev/null; then
            echo "::error::two builds of the same input differ"
            diff -r site-first site | head -20
            exit 1
          fi

          echo "two builds are byte identical"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3

        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: wiki
    runs-on: ubuntu-latest

    # Only deploy from the default branch, and only when the run was
    # not a pull request: a fork's Pages belong to the fork.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main'

    timeout-minutes: 15

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4