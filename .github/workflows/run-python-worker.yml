name: Run Python Workers

on:
  workflow_dispatch:

jobs:
  discover:
    name: Discover posts
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.posts.outputs.matrix }}
      post_count: ${{ steps.posts.outputs.post_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover post directories
        id: posts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          posts = sorted(
              path.parent.name
              for path in Path("data/posts").glob("*/post.json")
          )

          if not posts:
              raise SystemExit("No posts found under data/posts/")

          # GitHub allows 256 jobs in a matrix per run, and a local
          # saved-post archive took this repository from seven posts to
          # nearly five hundred. One job per post would exceed the limit
          # and the run would be cancelled before it started, so posts
          # are grouped into batches and each job handles a whole batch.
          #
          # The job count is now a function of the batch size rather
          # than the number of posts, which is what makes the workflow
          # keep working as material is added.
          chunk_size = int(
              os.environ.get("WORKER_BATCH_SIZE", "25")
          )

          if chunk_size < 1:
              raise SystemExit(
                  "WORKER_BATCH_SIZE must be at least 1"
              )

          batches = [
              {
                  "index": number,
                  "posts": posts[
                      number * chunk_size : (number + 1) * chunk_size
                  ],
              }
              for number in range(
                  (len(posts) + chunk_size - 1) // chunk_size
              )
          ]

          jobs = len(batches)

          if jobs > 256:
              raise SystemExit(
                  f"{jobs} jobs exceeds the 256 GitHub allows. "
                  f"Raise WORKER_BATCH_SIZE above "
                  f"{(len(posts) + 255) // 256}."
              )

          print(f"Discovered {len(posts)} post(s)")
          print(f"Batch size: {chunk_size}")
          print(f"Batches (jobs): {jobs}")
          for batch in batches:
              print(
                  f"  - batch {batch['index']}: "
                  f"{len(batch['posts'])} post(s)"
              )

          matrix = {"batch": batches}

          matrix_json = json.dumps(
              matrix,
              separators=(",", ":"),
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"matrix={matrix_json}\n"
              )
              output.write(
                  f"post_count={len(posts)}\n"
              )
          PY

    env:
      WORKER_BATCH_SIZE: ${{ vars.WORKER_BATCH_SIZE || '25' }}

  worker:
    name: Worker - batch ${{ matrix.batch.index }}
    needs: discover
    runs-on: ubuntu-latest

    # One post per job used to take about a minute. A batch of 25 takes
    # roughly half an hour, and a GitHub-hosted job may run for six
    # hours, so without a bound a single wedged model call would hold a
    # runner for the rest of the day and the run would still fail at the
    # end. Four times the expected cost is enough headroom for a slow
    # batch and short enough that a hang is reported as one.
    timeout-minutes: 120

    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 3

      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: npm install --global @opencode/cli

      - name: Verify runtime
        run: |
          python --version
          node --version
          opencode --version

      - name: Create cloud worker jobs
        env:
          RUN_ID: ${{ github.run_id }}
          BATCH: ${{ toJSON(matrix.batch.posts) }}

        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          batch = json.loads(os.environ["BATCH"])

          for post_id in batch:
              job_id = f"cloud_worker_{post_id}_{run_id}"

              job = {
                  "job_id": job_id,
                  "post_directory": f"data/posts/{post_id}",
                  "output_path": f"data/results/{job_id}.json",
                  "status": "pending",
                  "attempt": 0,
                  "max_attempts": 3,
              }

              path = Path(f"data/jobs/{job_id}.json")

              path.write_text(
                  json.dumps(job, indent=2),
                  encoding="utf-8",
              )

              print(f"Created job: {job_id}")
          PY

      - name: Run Python workers
        env:
          RUN_ID: ${{ github.run_id }}

        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          run_id = os.environ["RUN_ID"]

          # One post failing costs that post, not the rest of the
          # batch. Every job is attempted, the failures are named at
          # the end, and the results that did land are uploaded by the
          # next step so aggregation can report the shortfall rather
          # than nothing at all.
          failures = []

          for path in sorted(Path("data/jobs").glob(
              f"cloud_worker_*_{run_id}.json"
          )):
              print(f"=== {path.name} ===")

              result = subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "src.workers.cli",
                      "--job",
                      str(path),
                  ],
              )

              if result.returncode != 0:
                  failures.append(path.name)

          print()
          print(f"Batch finished: {len(failures)} failed")

          for name in failures:
              print(f"  FAILED {name}")

          # Recorded rather than raised, so the upload step runs and
          # keeps what succeeded. Aggregation compares the count it
          # received against the count discovered and fails loudly if
          # they differ, which is the honest signal.
          Path("batch-failures.json").write_text(
              json.dumps({"failed": failures}, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Report batch outcome
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("batch-failures.json")

          if not path.is_file():
              raise SystemExit("The batch step did not report.")

          failed = json.loads(
              path.read_text(encoding="utf-8")
          )["failed"]

          if failed:
              for name in failed:
                  print(f"::error::{name} failed")

              raise SystemExit(
                  f"{len(failed)} post(s) in this batch failed."
              )

          print("Every post in this batch produced a result.")
          PY

      - name: Upload worker results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: cloud-worker-result-${{ matrix.batch.index }}
          retention-days: 7
          if-no-files-found: error

          path: |
            data/jobs/cloud_worker_*.json
            data/results/cloud_worker_*.json

      - name: Cloud worker completed
        run: |
          echo "Worker completed successfully for ${{ matrix.post_id }}."

  aggregate:
    name: Aggregate knowledge base
    needs: [discover, worker]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download worker artifacts
        uses: actions/download-artifact@v4

        with:
          pattern: cloud-worker-result-*
          path: aggregation/worker-results

      - name: List downloaded worker artifacts
        run: |
          find aggregation/worker-results \
            -type f \
            -name "cloud_worker_*.json" \
            | sort

      - name: Run aggregation
        env:
          EXPECTED_POST_COUNT: ${{ needs.discover.outputs.post_count }}

        run: |
          python -m src.aggregation.aggregator \
            --input-dir aggregation/worker-results \
            --output aggregation/knowledge_base.json \
            --expected-post-count "${EXPECTED_POST_COUNT}"

      - name: Verify canonical knowledge base
        env:
          EXPECTED_POST_COUNT: ${{ needs.discover.outputs.post_count }}

        run: |
          test -s aggregation/knowledge_base.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("aggregation/knowledge_base.json")

          payload = json.loads(
              path.read_text(encoding="utf-8")
          )

          expected = int(
              os.environ["EXPECTED_POST_COUNT"]
          )

          aggregated = payload["stats"][
              "posts_aggregated"
          ]

          print(f"Expected posts: {expected}")
          print(f"Aggregated posts: {aggregated}")
          print(
              f"Skipped files: "
              f"{payload['stats']['files_skipped']}"
          )

          if aggregated != expected:
              raise SystemExit(
                  "Canonical knowledge base post count does "
                  "not match discovered post count."
              )

          for post in payload["posts"]:
              print(f"  - {post['id']}")
          PY

      - name: Upload canonical knowledge base
        uses: actions/upload-artifact@v4

        with:
          name: knowledge-base-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: aggregation/knowledge_base.json

      - name: Aggregation completed
        run: |
          echo "Canonical knowledge base uploaded as artifact:"
          echo "  knowledge-base-${{ github.run_id }}"

  wiki:
    name: Generate static wiki
    needs: [aggregate, discover]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download canonical knowledge base
        uses: actions/download-artifact@v4

        with:
          name: knowledge-base-${{ github.run_id }}
          path: aggregation

      - name: Generate static site
        env:
          EXPECTED_POST_COUNT: ${{ needs.discover.outputs.post_count }}

        run: |
          python -m src.wiki.generator \
            --input aggregation/knowledge_base.json \
            --output site

      - name: Verify generated site
        env:
          EXPECTED_POST_COUNT: ${{ needs.discover.outputs.post_count }}

        run: |
          test -s site/index.html
          test -s site/search.html
          test -s site/topics.html
          test -s site/questions.html
          test -s site/assets/search-index.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path("site")

          expected = int(
              os.environ["EXPECTED_POST_COUNT"]
          )

          index = json.loads(
              (
                  site / "assets" / "search-index.json"
              ).read_text(encoding="utf-8")
          )

          aggregated = index["posts"]

          print(f"Expected posts: {expected}")
          print(f"Posts in site: {aggregated}")

          if aggregated != expected:
              raise SystemExit(
                  "Generated site post count does not match the "
                  "discovered post count. Refusing to publish a "
                  "partial knowledge base."
              )

          for page in sorted(site.rglob("*.html")):
              print(f"  - {page.as_posix()}")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: [wiki]
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4