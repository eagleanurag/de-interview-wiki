name: Run Python Workers

on:
  workflow_dispatch:

jobs:
  discover:
    name: Discover posts
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.posts.outputs.matrix }}
      post_count: ${{ steps.posts.outputs.post_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Discover post directories
        id: posts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          posts = sorted(
              path.parent.name
              for path in Path("data/posts").glob("*/post.json")
          )

          if not posts:
              raise SystemExit("No posts found under data/posts/")

          matrix = {
              "post_id": posts
          }

          print("Discovered posts:")
          for post in posts:
              print(f"  - {post}")

          matrix_json = json.dumps(
              matrix,
              separators=(",", ":"),
          )

          print(f"Matrix JSON: {matrix_json}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(
                  f"matrix={matrix_json}\n"
              )
              output.write(
                  f"post_count={len(posts)}\n"
              )
          PY

  worker:
    name: Worker - ${{ matrix.post_id }}
    needs: discover
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      max-parallel: 3

      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: npm install --global @opencode/cli

      - name: Verify runtime
        run: |
          python --version
          node --version
          opencode --version

      - name: Create cloud worker job
        env:
          RUN_ID: ${{ github.run_id }}
          POST_ID: ${{ matrix.post_id }}

        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          post_id = os.environ["POST_ID"]

          job_id = f"cloud_worker_{post_id}_{run_id}"

          job = {
              "job_id": job_id,
              "post_directory": f"data/posts/{post_id}",
              "output_path": f"data/results/{job_id}.json",
              "status": "pending",
              "attempt": 0,
              "max_attempts": 3,
          }

          path = Path(
              f"data/jobs/{job_id}.json"
          )

          path.write_text(
              json.dumps(job, indent=2),
              encoding="utf-8",
          )

          print(f"Created job: {job_id}")
          print(f"Post: {post_id}")
          print(f"Job file: {path}")
          PY

      - name: Run Python worker
        env:
          POST_ID: ${{ matrix.post_id }}

        run: |
          python -m src.workers.cli \
            --job data/jobs/cloud_worker_${POST_ID}_${{ github.run_id }}.json

      - name: Verify worker result
        env:
          POST_ID: ${{ matrix.post_id }}

        run: |
          JOB_ID="cloud_worker_${POST_ID}_${{ github.run_id }}"

          echo "=== JOB ==="
          cat "data/jobs/${JOB_ID}.json"

          echo "=== RESULT ==="
          ls -lh "data/results/${JOB_ID}.json"

      - name: Upload worker result
        uses: actions/upload-artifact@v4

        with:
          name: cloud-worker-result-${{ matrix.post_id }}
          retention-days: 7
          if-no-files-found: error

          path: |
            data/jobs/cloud_worker_${{ matrix.post_id }}_${{ github.run_id }}.json
            data/results/cloud_worker_${{ matrix.post_id }}_${{ github.run_id }}.json

      - name: Cloud worker completed
        run: |
          echo "Worker completed successfully for ${{ matrix.post_id }}."

  aggregate:
    name: Aggregate knowledge base
    needs: [discover, worker]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download worker artifacts
        uses: actions/download-artifact@v4

        with:
          pattern: cloud-worker-result-*
          path: aggregation/worker-results

      - name: List downloaded worker artifacts
        run: |
          find aggregation/worker-results \
            -type f \
            -name "cloud_worker_*.json" \
            | sort

      - name: Run aggregation
        env:
          EXPECTED_POST_COUNT: ${{ needs.discover.outputs.post_count }}

        run: |
          python -m src.aggregation.aggregator \
            --input-dir aggregation/worker-results \
            --output aggregation/knowledge_base.json \
            --expected-post-count "${EXPECTED_POST_COUNT}"

      - name: Verify canonical knowledge base
        env:
          EXPECTED_POST_COUNT: ${{ needs.discover.outputs.post_count }}

        run: |
          test -s aggregation/knowledge_base.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("aggregation/knowledge_base.json")

          payload = json.loads(
              path.read_text(encoding="utf-8")
          )

          expected = int(
              os.environ["EXPECTED_POST_COUNT"]
          )

          aggregated = payload["stats"][
              "posts_aggregated"
          ]

          print(f"Expected posts: {expected}")
          print(f"Aggregated posts: {aggregated}")
          print(
              f"Skipped files: "
              f"{payload['stats']['files_skipped']}"
          )

          if aggregated != expected:
              raise SystemExit(
                  "Canonical knowledge base post count does "
                  "not match discovered post count."
              )

          for post in payload["posts"]:
              print(f"  - {post['id']}")
          PY

      - name: Upload canonical knowledge base
        uses: actions/upload-artifact@v4

        with:
          name: knowledge-base-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: aggregation/knowledge_base.json

      - name: Aggregation completed
        run: |
          echo "Canonical knowledge base uploaded as artifact:"
          echo "  knowledge-base-${{ github.run_id }}"

  wiki:
    name: Generate static wiki
    needs: [aggregate, discover]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download canonical knowledge base
        uses: actions/download-artifact@v4

        with:
          name: knowledge-base-${{ github.run_id }}
          path: aggregation

      - name: Generate static site
        env:
          EXPECTED_POST_COUNT: ${{ needs.discover.outputs.post_count }}

        run: |
          python -m src.wiki.generator \
            --input aggregation/knowledge_base.json \
            --output site

      - name: Verify generated site
        env:
          EXPECTED_POST_COUNT: ${{ needs.discover.outputs.post_count }}

        run: |
          test -s site/index.html
          test -s site/search.html
          test -s site/topics.html
          test -s site/questions.html
          test -s site/assets/search-index.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          site = Path("site")

          expected = int(
              os.environ["EXPECTED_POST_COUNT"]
          )

          index = json.loads(
              (
                  site / "assets" / "search-index.json"
              ).read_text(encoding="utf-8")
          )

          aggregated = index["posts"]

          print(f"Expected posts: {expected}")
          print(f"Posts in site: {aggregated}")

          if aggregated != expected:
              raise SystemExit(
                  "Generated site post count does not match the "
                  "discovered post count. Refusing to publish a "
                  "partial knowledge base."
              )

          for page in sorted(site.rglob("*.html")):
              print(f"  - {page.as_posix()}")
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: [wiki]
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4